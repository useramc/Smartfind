<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SmartFind</title>
<style>
:root{--bg:#f7f7fb;--card:#fff;--fg:#1d1d2b;--mut:#6b6b80;--ac:#5b4bdb;--bd:#e4e4ee}
@media(prefers-color-scheme:dark){:root{--bg:#14141c;--card:#1e1e2a;--fg:#ececf5;--mut:#9a9ab0;--ac:#8b7cff;--bd:#2c2c3c}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{margin:0;font-size:20px;color:var(--ac)}main{max-width:1100px;margin:0 auto;padding:20px}
.bar{display:flex;flex-wrap:wrap;gap:8px}input,select,button{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
#q{flex:1;min-width:240px}button{cursor:pointer}button.p{background:var(--ac);color:#fff;border:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card img{width:100%;height:160px;object-fit:contain;border-radius:8px;background:#fff}.card h3{font-size:13px;margin:0;line-height:1.3;max-height:3.9em;overflow:hidden}
.mut{color:var(--mut);font-size:12px}.price{font-weight:600}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px}
#modal .box{background:var(--card);max-width:760px;width:100%;border-radius:14px;padding:20px}
#modal img.main{max-height:260px;max-width:100%;display:block;margin:auto;background:#fff;border-radius:8px}
.rev{border-top:1px solid var(--bd);padding:8px 0}.x{float:right}#msg{margin:12px 0;color:var(--mut)}
</style></head><body>
<header><h1>🔎 SmartFind</h1><div id="auth"></div></header>
<main>
<div class="bar"><input id="q" placeholder='Try: "lightweight laptop bag for travel under 2000"'><input id="b" type="number" min="0" placeholder="Max budget" style="width:130px">
<select id="c"><option value="">All categories</option></select><select id="r"><option value="">Any rating</option><option value="4">4★ & up</option><option value="3">3★ & up</option></select>
<button class="p" onclick="search()">Search</button><button onclick="showSaved()">Saved</button><button onclick="showRecs()">For you</button></div>
<div id="msg">Describe what you need in plain language - SmartFind finds products by meaning, not just keywords.</div><div class="grid" id="grid"></div></main>
<div id="modal" onclick="if(event.target===this)this.style.display='none'"><div class="box" id="box"></div></div>
<script>
let token=localStorage.sf_token||"",user=JSON.parse(localStorage.sf_user||"null");
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(path,opt={}){opt.headers={"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{}),...(opt.headers||{})};
 const r=await fetch(path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||r.statusText);return d}
function renderAuth(){$("auth").innerHTML=user?`Hi, ${esc(user.name)} <button onclick="logout()">Logout</button>`:`<button onclick="authForm()">Login / Register</button>`}
function logout(){token="";user=null;localStorage.removeItem("sf_token");localStorage.removeItem("sf_user");renderAuth()}
function authForm(){openBox(`<h3>Login / Register</h3><input id="an" placeholder="Name (register only)"><br><br><input id="ae" placeholder="Email"><br><br><input id="ap" type="password" placeholder="Password"><br><br>
<button class="p" onclick="doAuth('login')">Login</button> <button onclick="doAuth('register')">Register</button> <span id="ae2" class="mut"></span>`)}
async function doAuth(kind){try{const body={email:$("ae").value,password:$("ap").value};if(kind=="register")body.name=$("an").value||"User";
 const d=await api("/auth/"+kind,{method:"POST",body:JSON.stringify(body)});token=d.token;user=d.user;localStorage.sf_token=token;localStorage.sf_user=JSON.stringify(user);renderAuth();$("modal").style.display="none"}catch(e){$("ae2").textContent=e.message}}
function openBox(h){$("box").innerHTML=`<button class="x" onclick="$('modal').style.display='none'">✕</button>`+h;$("modal").style.display="flex"}
function cards(ps){$("grid").innerHTML=ps.map(p=>`<div class="card" onclick="openProduct(${p.product_id})"><img loading="lazy" src="${esc(p.image||"")}" onerror="this.style.visibility='hidden'">
<h3>${esc(p.name)}</h3><div class="price">${p.price!=null?"$"+p.price:"Price n/a"}</div><div class="mut">${p.average_rating?"★ "+p.average_rating+" ("+p.rating_number+")":"No ratings"}${p.score!=null?" · match "+Math.round(p.score*100)+"%":""}</div></div>`).join("")}
async function search(){const q=$("q").value.trim();if(q.length<2)return;$("msg").textContent="Searching...";
 try{const d=await api("/search/",{method:"POST",body:JSON.stringify({query:q,budget_max:$("b").value?+$("b").value:null,category_id:$("c").value?+$("c").value:null,min_rating:$("r").value?+$("r").value:null})});
 $("msg").textContent=`${d.count} results`+(d.budget_applied?` · budget ≤ ${d.budget_applied}`:"");cards(d.products)}catch(e){$("msg").textContent="Error: "+e.message}}
async function showSaved(){try{const d=await api("/me/saved");$("msg").textContent=`${d.products.length} saved`;cards(d.products)}catch(e){$("msg").textContent=e.message;authForm()}}
async function showRecs(){try{const d=await api("/me/recommendations");$("msg").textContent=d.reason||"Recommended from your activity";cards(d.products)}catch(e){$("msg").textContent=e.message;authForm()}}
async function openProduct(id){const [p,rv]=await Promise.all([api("/products/"+id),api(`/products/${id}/reviews?limit=5`)]);
 if(token)api("/me/click",{method:"POST",body:JSON.stringify({product_id:id})}).catch(()=>{});
 const feats=(p.features||[]).slice(0,6).map(f=>`<li>${esc(f)}</li>`).join("");
 openBox(`${p.image?`<img class="main" src="${esc(p.image)}">`:""}<h2>${esc(p.name)}</h2><div class="mut">${esc(p.brand||"")} · ${p.price!=null?"$"+p.price:"Price n/a"} · ★ ${p.average_rating??"-"} (${p.rating_number})</div>
 <p><button class="p" onclick="toggleSave(${id})">♡ Save</button> ${p.sources.map(s=>`<a href="${esc(s.product_url)}" target="_blank" rel="noopener">View on ${esc(s.platform_name)}</a>`).join(" ")}</p>
 <ul>${feats}</ul><p>${esc((p.description||"").slice(0,700))}</p><h3>Top reviews</h3>${rv.reviews.map(r=>`<div class="rev"><b>${"★".repeat(Math.round(r.rating))}</b> ${esc(r.review_title)}<div class="mut">${esc((r.review_text||"").slice(0,300))}</div></div>`).join("")||"<span class=mut>No reviews</span>"}`)}
async function toggleSave(id){try{await api("/me/saved/"+id,{method:"PUT"});alert("Saved!")}catch(e){authForm()}}
(async()=>{renderAuth();try{(await api("/products/categories")).forEach(c=>$("c").insertAdjacentHTML("beforeend",`<option value="${c.category_id}">${esc(c.category_name)}</option>`))}catch(e){}})();
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
</script></body></html>
